<style>
:root {
  /* Status colors are intentionally theme-independent — a green/red light
     needs to mean the same thing no matter which palette is active. This is
     what powers the Dashboard's "green light / red light" board. */
  --done: #2fa06a;
  --done-bg: #e7f6ee;
  --partial: #d99a1f;
  --partial-bg: #fdf3e0;
  --none: #9aa0b8;
  --none-bg: #eef0f6;
  --attention: #e0554f;
  --attention-bg: #fdecec;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(20, 24, 50, 0.04), 0 4px 14px rgba(20, 24, 50, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;

  --accent-h: 18; /* used by the "custom" theme; overridden inline by JS */
}

/* ==========================================================================
   Themes — Sunset is the default. Mono Light / Mono Dark / Custom (pick any
   single hue and the whole UI is shades of it) are opt-in from Settings.
   ========================================================================== */

  --surface: #ffffff;

  --primary-dark: #45449a;

  --hero-sky-top: #b7b2e2;
  --hero-sky-mid: #f2c3b3;
  --hero-sky-bottom: #ffe0a6;
  --hero-sun: #ffc98a;
  --hero-sun-core: #ffe7ab;

  --hill-mid: #8fa98a;
  --hill-near: #6e8e6b;

html[data-theme="mono-light"] {
  --hill-far: #dcdcdc; --hill-mid: #c6c6c6; --hill-near: #adadad; --flower: #6c6c6c; --flower-tip: #ffffff; --tree: #8a8a8a; --fence: #9a9a9a;
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #efefef;

html[data-theme="mono-dark"] {
  --hill-far: #2e2e33; --hill-mid: #26262a; --hill-near: #1d1d20; --flower: #8a8a92; --flower-tip: #c9c9cf; --tree: #45454b; --fence: #4f4f55;

html[data-theme="custom"] {
  --hill-far: hsl(calc(var(--accent-h) + 60) 22% 72%); --hill-mid: hsl(calc(var(--accent-h) + 60) 22% 60%); --hill-near: hsl(calc(var(--accent-h) + 60) 22% 48%); --flower: hsl(var(--accent-h) 60% 52%); --flower-tip: #ffffff; --tree: hsl(var(--accent-h) 15% 30%); --fence: hsl(var(--accent-h) 20% 45%);
  --bg: hsl(var(--accent-h) 45% 97%);
  --surface: #ffffff;
  --surface-2: hsl(var(--accent-h) 45% 93%);
  --text: hsl(var(--accent-h) 30% 18%);
  --muted: hsl(var(--accent-h) 15% 45%);
  --border: hsl(var(--accent-h) 40% 89%);
  --primary: hsl(var(--accent-h) 70% 55%);
  --primary-dark: hsl(var(--accent-h) 70% 42%);
  --on-primary: #ffffff;
  --accent-pink: hsl(var(--accent-h) 60% 80%);
  --accent-blue: hsl(var(--accent-h) 50% 70%);
  --accent-yellow: hsl(var(--accent-h) 65% 75%);
  --hero-sky-top: hsl(var(--accent-h) 55% 75%);
  --hero-sky-mid: hsl(var(--accent-h) 65% 68%);
  --hero-sky-bottom: hsl(var(--accent-h) 75% 62%);
  --hero-sun: hsl(var(--accent-h) 80% 72%);
  --hero-sun-core: hsl(var(--accent-h) 85% 85%);
  --hero-ocean: hsl(var(--accent-h) 45% 50%);
  --hero-ocean-dark: hsl(var(--accent-h) 45% 40%);
  --hero-foam: #ffffff;
  --hero-cloud: #ffffff;

*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary-dark)}
html[data-theme="mono-dark"] a{color:var(--text)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
select,input[type=text],input[type=date],input[type=number],textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);width:100%}
textarea{min-height:84px;resize:vertical}
input[type=range]{accent-color:var(--primary)}
input[type=checkbox]{accent-color:var(--primary);width:20px;height:20px}
.mini{width:auto;font-size:14px;padding:6px 9px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}

/* shell, same as Adulting */
#appShell{display:flex;flex-direction:column;min-height:100vh}
#app{display:flex;flex:1;min-height:0}
.hero-banner{width:100%;display:block;line-height:0;background:var(--hero-sky-bottom)}
.hero-banner svg{width:100%;height:100%;display:block}
.hero-banner-inner{position:relative;height:128px}
@media (max-width:820px){.hero-banner-inner{height:88px}}
.logo-mark{display:inline-flex;flex-shrink:0}.logo-mark svg{display:block}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.sb-brand{padding:6px 4px 14px;display:flex;align-items:center;gap:10px}
.brand-title{font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:700;color:var(--text);line-height:1.15}
.brand-sub{font-size:12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius-sm);color:var(--text);background:transparent;text-align:left;font-weight:600;font-size:14.5px;text-decoration:none;border:none}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--surface-2);color:var(--primary-dark);box-shadow:inset 3px 0 0 var(--primary)}
html[data-theme="mono-dark"] .nav-item.on{color:var(--text)}
.sb-foot{margin-top:auto;padding-top:12px}
.sb-foot select{font-size:13px;padding:7px 9px}
main{flex:1;padding:28px 32px 80px;max-width:1000px;min-width:0}
@media (max-width:820px){#app{flex-direction:column}.sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:10px;align-items:center}.sb-brand{padding:0 8px 0 0}.sb-brand .brand-sub{display:none}.sb-foot{margin:0 0 0 8px;padding:0}.sb-foot .ver{display:none}main{padding:20px}}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:28px;letter-spacing:-.01em;margin:0 0 6px}
.card h3{font-family:"Fraunces",Georgia,serif;font-size:17.5px;font-weight:600}
h3{font-size:16px;margin:0 0 8px;font-weight:700}
.page-sub{color:var(--muted);margin:0 0 22px}

/* cards, buttons, pills */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 1px 2px rgba(40,30,60,.04),0 6px 18px rgba(60,50,110,.06);padding:20px;margin-bottom:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.btn{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:600;background:var(--surface-2);color:var(--text);transition:background .15s ease;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-dark);filter:none}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.mini{padding:6px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.none{background:var(--none-bg);color:var(--muted)}
.pill.partial,.pill.amber{background:var(--partial-bg);color:var(--partial)}
.pill.done{background:var(--done-bg);color:var(--done)}
html[data-theme="mono-dark"] .pill.none{background:var(--surface-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--partial);margin-right:6px;vertical-align:middle}
.list .item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--border)}
.list .item:first-child{border-top:none}
.item .grow{flex:1;min-width:0}
.clickable{cursor:pointer}.clickable:hover{background:var(--surface-2);border-radius:var(--radius-sm)}
.card.clickable:hover{background:var(--surface)}
.lesson-body p{margin:8px 0}.lesson-body ul{margin:6px 0 6px 20px;padding:0}
.quote{border-left:4px solid var(--primary);padding:10px 14px;margin:10px 0;background:var(--surface-2);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-radius:7px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.reassure{display:flex;align-items:center;gap:12px;background:var(--done-bg);color:#1c6b48;border:1px solid #bfe6d3;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;font-weight:600}
html[data-theme="mono-dark"] .reassure{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.section-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.progress-bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.progress-bar>div{height:100%;background:var(--primary);border-radius:999px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-radius:16px 16px 4px 16px}
.msg.me .who{color:inherit;opacity:.8}
.msg.blue{align-self:flex-start;background:var(--surface-2);border-radius:14px 14px 14px 4px}
.msg .who{font-size:12px;color:var(--muted);display:block;margin-bottom:2px;font-weight:600}
.bb{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:17px}

/* dialog styled like Adulting's modal */
dialog{border:none;border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;width:min(560px,94vw);box-shadow:0 10px 40px rgba(20,20,40,.25)}
dialog::backdrop{background:rgba(20,22,40,.4)}
dialog .dhead{padding:22px 24px 0}
dialog .dbody{padding:4px 24px 12px;max-height:70vh;overflow:auto}
dialog .dfoot{padding:12px 24px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sync{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:8px 0}
details summary{cursor:pointer;color:var(--muted);font-size:15px}

/* settings pickers, same as Adulting */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}
.theme-swatch{border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center;background:var(--surface);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--text)}
.theme-swatch.active{border-color:var(--primary)}
.theme-swatch .preview{height:34px;border-radius:7px;margin-bottom:8px}
.theme-swatch .preview.sunset{background:linear-gradient(135deg,#7fb7d6,#f6a6c1 50%,#ffd873)}
.theme-swatch .preview.hill-country{background:linear-gradient(180deg,#b7b2e2,#f2c3b3 45%,#ffe0a6 62%,#8fa98a 63%,#5b5bb5 100%)}
.theme-swatch .preview.mono-light{background:linear-gradient(135deg,#fafafa,#d9d9d9);border:1px solid #ddd}
.theme-swatch .preview.mono-dark{background:linear-gradient(135deg,#3d3d42,#121214)}
.theme-swatch .preview.custom{background:linear-gradient(135deg,hsl(var(--accent-h) 55% 75%),hsl(var(--accent-h) 75% 45%))}
.icon-style-grid{display:flex;gap:10px}
.icon-style-option{flex:1;border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;background:var(--surface);cursor:pointer;font-weight:700;font-size:13px;color:var(--text)}
.icon-style-option.active{border-color:var(--primary)}
.icon-style-option .sample{font-size:22px;margin-bottom:6px}

</style>
</head>

<div id="appShell">
  <header class="hero-banner" id="heroBanner" aria-hidden="true"></header>
  <div id="app">
    <nav class="sidebar" id="sidebar"></nav>

  </div>
</div>
<dialog id="dlg"><div class="dhead"><h3 id="dlgTitle"></h3></div><div class="dbody" id="dlgBody"></div><div class="dfoot" id="dlgFoot"></div></dialog>
<div class="toast" id="toast"></div>
<script src="/Blue-Bonnet-LLM/blue-bonnet-kit.js"></script>
<script>
/* ---------- constants ---------- */
const BRANDS = {
  adv:{name:"ADV Media", desc:"Live event and broadcast production"},
  vb:{name:"Valencia Brown", desc:"Consulting and brand strategy (advisory only)"},
  terc:{name:"Terciopelo Media", desc:"Boudoir, burlesque, and adult creative work"}
};
const STAGES = [
  {id:"lead", name:"Lead", cadence:14},
  {id:"talking", name:"Talking", cadence:7},
  {id:"client", name:"Client", cadence:30},
  {id:"past", name:"Past client", cadence:60},
  {id:"partner", name:"Partner or referrer", cadence:30}
];
const TOUCH_TYPES = ["Call","Email","Text","In person","At an event","Sent something useful"];
const STATUS = ["not started","in progress","done"];

/* ---------- lessons ---------- */
const LESSONS = [
{ id:"trust", title:"Trust is the product", lib:["trust"],
  source:"The Trusted Advisor, Maister, Green and Galford (2000)",
  body:`<p>The authors break trust into four parts and put them in one formula:</p>
<div class="quote"><b>Trust = (Credibility + Reliability + Intimacy) ÷ Self-orientation</b></div>
<ul>
<li><b>Credibility</b> is about your words. Do they believe what you say about the work?</li>
<li><b>Reliability</b> is about your actions over time. Do the small promises get kept?</li>
<li><b>Intimacy</b> is whether they feel safe telling you the real problem.</li>
<li><b>Self-orientation</b> is how much the conversation is about you. It sits on the bottom, so it is the only part where lower is better. A strong resume does not make up for it.</li>
</ul>
<p>In your work: credibility is your track record. Reliability is the recap that shows up when you said it would. Intimacy is the athletic director telling you what went wrong with the last vendor. Self-orientation is talking about your switcher when they want to talk about their Friday night.</p>`,
  drill:"Pick your three most important clients. From their point of view, rate yourself 1 to 5 on credibility, reliability, intimacy, and self-orientation. Write down your weakest part with each one and one thing you will do about it this month."},
{ id:"ufc", title:"Set the meeting up front", lib:["sandler"],
  source:"Sandler Selling System (David Sandler), the up-front contract",
  body:`<p>Before a real conversation starts, agree out loud on what will happen. Sandler trainers teach five parts: <b>purpose</b> (why you're meeting), <b>time</b>, <b>their agenda</b> (what they want out of it), <b>your agenda</b>, and the <b>outcome</b> (what decision you'll reach at the end).</p>
<p>The key piece: tell them it is fine to say no. A clear no early saves you weeks of chasing a maybe.</p>
<div class="quote">"Thanks for making time. I'd like to use about 20 minutes to understand your season and what's not working right now. I'll ask some questions, and you can ask me anything. At the end, if it's not a fit, just tell me. If it is, we'll pick a next step together. Does that work?"</div>
<p>When a meeting ends with "let me think about it," the outcome was never agreed. This fixes that.</p>`,
  drill:"Write the opener you will use on your next real call or meeting. Keep it under 40 words. Say it out loud twice."},
{ id:"spin", title:"Ask before you pitch", lib:["spin"],
  source:"SPIN Selling, Neil Rackham (1988), built from a study of 35,000 sales calls",
  body:`<p>Four kinds of questions, usually in this order:</p>
<ul>
<li><b>Situation:</b> facts about how things work now. Keep these few. Do your homework so you don't waste their time.</li>
<li><b>Problem:</b> what is hard, slow, or not working.</li>
<li><b>Implication:</b> what that problem costs them. Time, money, reputation, stress.</li>
<li><b>Need-payoff:</b> what it would be worth to fix. The point is that <i>they</i> say the value, not you.</li>
</ul>
<p>Example for a venue: "How are your shows staffed today?" (S) "Where does it break down?" (P) "When a call goes short-staffed, what happens to the show and to you?" (I) "If every call was filled and the house never had to think about it, what would that free up?" (N)</p>`,
  drill:"For one real prospect, write one question of each type. Use the Question bank in Practice if you get stuck."},
{ id:"listen", title:"Listen so they feel heard", lib:["voss"],
  source:"Never Split the Difference, Chris Voss",
  body:`<ul>
<li><b>Mirror:</b> repeat the last one to three important words they said, as a question. "Short-staffed?" Then wait. They keep talking.</li>
<li><b>Label:</b> name what they seem to feel. "It sounds like the last vendor left you holding the bag." Don't say "I hear you."</li>
<li><b>Calibrated questions:</b> open questions that start with what or how. "What would make this an easy yes for your board?"</li>
<li><b>Skip "why."</b> It sounds like an accusation. "What's been holding this up?" works better than "Why haven't you decided?"</li>
<li><b>Aim for "That's right."</b> Summarize their situation so well they say it. "You're right" usually means they want you to stop.</li>
</ul>`,
  drill:"On your next call, use one mirror and one label on purpose. Afterward, log in the Debrief what they said right after each one."},
{ id:"qualify", title:"Qualify early: pain, budget, decision", lib:["sandler"],
  source:"Sandler Selling System",
  body:`<p>Before you write a proposal, know three things:</p>
<ul>
<li><b>Pain:</b> the real problem, in their words.</li>
<li><b>Budget:</b> is there money, and roughly how much. If there is no budget, you are educating, not selling. That can still be worth doing, but call it what it is.</li>
<li><b>Decision:</b> who signs, who else has a say, and when it gets decided.</li>
</ul>
<p>For schools and cities, the budget follows the fiscal year and big spends may need board or council approval. Ask: "Who besides you needs to be comfortable with this?" and "When does something like this usually get approved?"</p>`,
  drill:"For every open opportunity, write what you know about pain, budget, and decision. Each blank is your next question."},
{ id:"public", title:"Rules for schools and cities", lib:["isd"],
  source:"Dallas ISD Board Policy CHE (Local) restricted contact period; San Antonio ISD blackout period notices",
  body:`<p>Many Texas districts limit contact while a bid is open. For example, Dallas ISD's restricted contact period starts when an RFP or bid is issued and runs until the award. San Antonio ISD's blackout period also starts on the posting date and ends at award. During that time you talk only to the contact named in the solicitation.</p>
<p>What that means for relationships:</p>
<ul>
<li>Build them <b>between</b> solicitations. Attend events, deliver great work, send useful things.</li>
<li>When a bid is open, go through procurement only. Reaching out to the coach or principal about it can hurt you.</li>
<li>Rules differ by district. Read the solicitation and the district's vendor page each time.</li>
</ul>`,
  drill:"For each district or city you're pursuing, note in their People entry whether a bid is open right now and who the named contact is."},
{ id:"keep", title:"The next sale starts after the event", lib:["hbr","sandler"],
  source:"Reichheld and Sasser, \"Zero Defections,\" Harvard Business Review (1990); Sandler post-sell step",
  body:`<p>In a 1990 Harvard Business Review article, Frederick Reichheld and Earl Sasser reported that cutting customer defections by 5% raised profits by 25% to 85%, depending on the industry. Their examples ran from 85% at one bank's branches to 30% at an auto service chain. Later Bain material often quotes 25% to 95%.</p>
<p>Be careful with the exact number. Critics argue it overstates things, because not every client is profitable to keep. The useful part holds up: keeping good clients is usually cheaper than finding new ones, and it compounds.</p>
<p>Habits that help:</p>
<ul>
<li>Send a short recap soon after each event: what went well, anything you fixed, one thing you'd suggest for next time.</li>
<li>Ask what they would change. Then change it and tell them you did.</li>
<li>Get the next date on the calendar before the current one ends.</li>
<li>Check in when you <i>don't</i> need anything. Send something useful.</li>
</ul>`,
  drill:"Write a recap message you can reuse after every event. Five sentences or fewer. Save it in Practice notes."},
{ id:"intro", title:"Ask for introductions", lib:["trust"],
  source:"Builds on the trust and post-sell lessons",
  body:`<p>The best time to ask is right after they tell you something went well. Make the ask specific so it is easy to answer.</p>
<div class="quote">"I'm really glad that went well. Is there another athletic director or venue manager you think should have this kind of night? I'd be glad to buy you both lunch."</div>
<ul>
<li>Track who refers you. Thank them every time, and tell them how it turned out.</li>
<li>Partners count too: companies bidding on work that need your piece of it.</li>
</ul>`,
  drill:"Pick two happy clients. Write the exact sentence you will use to ask each one for an introduction."},
{ id:"lanes", title:"Keep each brand in its own lane", lib:[],

/* ---------- state + storage ---------- */
const LS_KEY = "clienting.v1";
const blank = () => ({people:[], inbox:[], lessons:{}, drills:{}, notes:"", settings:{theme:"hill-country", customHue:250, iconStyle:"colorful", matchAdulting:true, brand:"all", showTerc:false, shareBlueMem:true}, updated:0});
let S = blank();
let db=null, uid=null, docRef=null, remoteOK=false;
let saveTimer=null, writing=false, pending=false;

function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); if(r) S=Object.assign(blank(),JSON.parse(r)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  S.updated=Date.now(); saveLocal();
  clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote,900);
}
async function pushRemote(){
  if(!remoteOK) return;
  if(writing){ pending=true; return; }
  writing=true;
  try{ await docRef.set({json:JSON.stringify(S), updated:S.updated}); setSync("Saved to your account"); }
  catch(e){ setSync("Saved on this device only"); if(e&&e.code==="invalid_argument") remoteOK=false; }
  writing=false;
  if(pending){ pending=false; pushRemote(); }
}
function setSync(t){ const el=document.getElementById("syncNote"); if(el) el.textContent=t; syncText=t; }
let syncText="Saved on this device";

async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const u = await window.claude.use("user"); if(!u) return;
    uid = await u.id(); if(!uid) return;
    db = await window.claude.use("db"); if(!db) return;
    docRef = db.doc("data/users/"+uid+"/state");
    const snap = await docRef.get();
    remoteOK=true;
    if(snap.exists){
      const d=snap.data(); let remote=null;
      try{ remote=JSON.parse(d.json); }catch(e){}
      if(remote && (remote.updated||0) >= (S.updated||0)){ S=Object.assign(blank(),remote); saveLocal(); render(); }
      else if(S.updated) pushRemote();
    } else if(S.updated){ pushRemote(); }
    setSync("Saved to your account");
  }catch(e){ setSync("Saved on this device only"); }
}

/* ---------- dialog ---------- */
function openDlg(title, bodyHTML, buttons){
  $("#dlgTitle").textContent=title; $("#dlgBody").innerHTML=bodyHTML;
  const f=$("#dlgFoot"); f.innerHTML="";
  buttons.forEach(b=>{ const el=document.createElement("button"); el.className="btn "+(b.cls||""); el.textContent=b.label;
    el.onclick=()=>{ if(b.fn && b.fn()===false) return; $("#dlg").close(); }; f.appendChild(el); });
  $("#dlg").showModal();
}

/* ---------- views ---------- */
const VIEWS={today:vToday,people:vPeople,learn:vLearn,practice:vPractice,blue:vBlue,library:vLibrary,data:vData};
let lessonId=null;
let view="today";
function route(){ const h=(location.hash||"#today").slice(1); lessonId=null;
  if(h.startsWith("lesson-") && LESSONS.find(l=>l.id===h.slice(7))){ view="learn"; lessonId=h.slice(7); }
  else view=VIEWS[h]?h:"today";
  render(); window.scrollTo(0,0); }
window.addEventListener("hashchange",route);
function render(){
  renderNav();
  const m=$("#main"); m.innerHTML=""; VIEWS[view](m);
}

/* Today */
function vToday(m){
  const ready=visiblePeople().filter(readyForTouch).sort((a,b)=>(daysSince(lastTouch(b))??9999)-(daysSince(lastTouch(a))??9999));
  const nextLesson=LESSONS.find(l=>(S.lessons[l.id]||"not started")!=="done");
  const inbox=S.inbox;
  m.innerHTML=`<h1>Today</h1><p class="page-sub">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p>
  ${!ready.length&&visiblePeople().length?`<div class="reassure"><span style="font-size:22px">✓</span> You're caught up. Nobody needs a touch right now.</div>`:""}
  <div class="card">
    <h3>Quick note</h3>
    <p class="muted small" style="margin:0 0 8px">Type anything. A name, a lead, something someone said. Sort it later or never.</p>
    <textarea id="cap" placeholder="Met the new venue GM at the Arlington show, wants a call after the holidays"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="capSave">Save note</button><span class="sync" id="syncNote">${esc(syncText)}</span></div>
  </div>
  ${inbox.length?`<div class="card"><h3>Notes</h3><div class="list">${inbox.map(n=>`
    <div class="item"><div class="grow"><div>${esc(n.text)}</div><div class="muted small">${fmtDate(n.d)}</div></div>
    <button class="btn mini" data-attach="${n.id}">Add to a person</button><button class="btn ghost mini" data-del="${n.id}">Remove</button></div>`).join("")}</div></div>`:""}
  <div class="card">
    <h3>Ready for a touch</h3>
    <p class="muted small" style="margin:0 0 6px">People whose usual check-in time has come around. A short useful message counts.</p>
    <div class="list">${ready.length?ready.map(p=>{const d=daysSince(lastTouch(p));return `
      <div class="item"><div class="grow clickable" data-open="${p.id}"><b>${esc(p.name)}</b> <span class="muted">${esc(p.org||"")}</span>
      <div class="small muted"><span class="dot"></span>${d===null?"No touches logged yet":"Last touch "+d+" days ago"} · every ${p.cadence} days · ${stageName(p.stage)}</div></div>
      <button class="btn mini" data-touch="${p.id}">Log touch</button></div>`}).join(""):`<div class="empty">Nobody right now.</div>`}</div>
  </div>
  ${nextLesson?`<div class="card clickable" id="nextLesson"><span class="pill ${stClass(S.lessons[nextLesson.id])}">${S.lessons[nextLesson.id]||"not started"}</span>
    <h3 style="margin-top:8px">This week: ${esc(nextLesson.title)}</h3><div class="muted small">${esc(nextLesson.source)}</div></div>`:
    `<div class="card"><h3>All lessons done</h3><p class="muted">Go back through any of them, or practice with Blue Bonnet.</p></div>`}
  `;
  $("#capSave").onclick=()=>{ const t=$("#cap").value.trim(); if(!t) return; S.inbox.unshift({id:uidGen(),d:today(),text:t}); save(); render(); toast("Saved"); };
  m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.inbox=S.inbox.filter(n=>n.id!==b.dataset.del); save(); render();});
  m.querySelectorAll("[data-attach]").forEach(b=>b.onclick=()=>attachNote(b.dataset.attach));
  m.querySelectorAll("[data-touch]").forEach(b=>b.onclick=()=>logTouch(b.dataset.touch));
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>personDetail(b.dataset.open));
  const nl=$("#nextLesson"); if(nl) nl.onclick=()=>{location.hash="#lesson-"+nextLesson.id;};
}
function attachNote(nid){
  const n=S.inbox.find(x=>x.id===nid); const ppl=visiblePeople();
  openDlg("Add note to a person",`<p>${esc(n.text)}</p><label>Person</label><select id="anP"><option value="__new">New person…</option>${ppl.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>`,
  [{label:"Cancel"},{label:"Add",cls:"primary",fn:()=>{
    const v=$("#anP").value;
    if(v==="__new"){ setTimeout(()=>editPerson(null,{notes:n.text},()=>{S.inbox=S.inbox.filter(x=>x.id!==nid);}),0); return; }
    const p=S.people.find(x=>x.id===v); p.notes=(p.notes?p.notes+"\n":"")+fmtDate(n.d)+": "+n.text;
    S.inbox=S.inbox.filter(x=>x.id!==nid); save(); render(); toast("Added");
  }}]);
}

/* People */
let peopleSearch="";
function vPeople(m){
  const ppl=visiblePeople().filter(p=>!peopleSearch||(p.name+" "+(p.org||"")+" "+(p.notes||"")).toLowerCase().includes(peopleSearch.toLowerCase()));
  const byStage=STAGES.map(s=>({s,list:ppl.filter(p=>p.stage===s.id)})).filter(g=>g.list.length);
  m.innerHTML=`<h1>People</h1><p class="page-sub">Clients, leads, and the people who send you work.</p><div class="row" style="margin-bottom:16px"><input type="text" id="ps" placeholder="Search people" value="${esc(peopleSearch)}" style="flex:1;min-width:180px"><button class="btn primary" id="addP">Add person</button></div>
  ${byStage.length?byStage.map(g=>`<div class="card"><h3>${g.s.name} <span class="muted small">${g.list.length}</span></h3><div class="list">${g.list.map(p=>{const d=daysSince(lastTouch(p));return `
    <div class="item clickable" data-open="${p.id}"><div class="grow"><b>${esc(p.name)}</b> <span class="muted">${esc(p.org||"")}</span>
    <div class="small muted">${BRANDS[p.brand].name} · ${d===null?"no touches yet":"last touch "+d+" days ago"}</div></div>
    ${readyForTouch(p)?`<span class="pill amber">ready for a touch</span>`:""}</div>`}).join("")}</div></div>`).join(""):
    `<div class="card"><p class="muted">No people yet. Add your current clients first, then the people you want to work with.</p></div>`}`;
  $("#ps").oninput=e=>{peopleSearch=e.target.value; const pos=e.target.selectionStart; render(); const el=$("#ps"); el.focus(); el.setSelectionRange(pos,pos);};
  $("#addP").onclick=()=>editPerson(null);
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>personDetail(b.dataset.open));
}
function editPerson(id, preset, after){
  const p=id?S.people.find(x=>x.id===id):Object.assign({name:"",org:"",role:"",brand:S.settings.brand!=="all"?S.settings.brand:"adv",stage:"lead",cadence:14,cares:"",notes:"",contact:""},preset||{});
  const brandOpts=Object.entries(BRANDS).filter(([k])=>k!=="terc"||S.settings.showTerc||p.brand==="terc").map(([k,v])=>`<option value="${k}" ${p.brand===k?"selected":""}>${v.name}</option>`).join("");
  openDlg(id?"Edit person":"Add person",`
    <div class="grid2"><div><label>Name</label><input type="text" id="fN" value="${esc(p.name)}"></div>
    <div><label>Organization</label><input type="text" id="fO" value="${esc(p.org)}"></div>
    <div><label>Role</label><input type="text" id="fR" value="${esc(p.role)}"></div>
    <div><label>Phone or email</label><input type="text" id="fC" value="${esc(p.contact)}"></div>

/* ---------- interactive tools ---------- */
function choiceQuiz(el, items){
  // items: [{q, opts:[...], a:index, why}]
  let i=0, right=0;
  const draw=()=>{
    if(i>=items.length){ el.innerHTML=`<p><b>${right} of ${items.length}</b> on the first try.</p><button class="btn" id="qz">Go again</button>`; el.querySelector("#qz").onclick=()=>{i=0;right=0;draw();}; return; }
    const it=items[i]; let tried=false;
    el.innerHTML=`<div class="muted small">${i+1} of ${items.length}</div><p style="font-size:18px">${esc(it.q)}</p><div id="opts">${it.opts.map((o,k)=>`<button class="btn" data-k="${k}" style="display:block;width:100%;text-align:left;margin:6px 0">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`;
    el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===it.a; if(!tried && ok) right++; tried=true;
      el.querySelectorAll("[data-k]").forEach(x=>{x.style.borderColor=""; x.style.background="";});
      b.style.borderColor=ok?"var(--primary)":"var(--partial)"; b.style.background=ok?"var(--surface-2)":"var(--partial-bg)";
      el.querySelector("#fb").innerHTML=`<p>${ok?"<b>Yes.</b> ":"<b>Not quite.</b> "}${esc(it.why)}</p>${ok?`<button class="btn primary" id="nx">Next</button>`:""}`;
      const nx=el.querySelector("#nx"); if(nx) nx.onclick=()=>{i++;draw();};
    });
  };
  draw();
}

   `<label>Your script</label><div class="quote" id="out" style="white-space:pre-wrap;min-height:40px"></div>

/* Blue Bonnet */
let blueMode="mentor", blueMsgs=[], blueBusy=false, sampleFn=null, blueCtx={};
const SCENARIOS={
  adv:[["ad","A high school athletic director whose district is unhappy with its current broadcast vendor"],["venue","A venue general manager who needs reliable crews for touring shows"],["corp","A corporate event planner booking a one-day conference"],["partner","A larger company bidding on a venue contract that may need an AV production partner"]],
  vb:[["small","A small business owner who says people don't understand what they do"],["creator","A performer who wants a brand but isn't sure they can pay for strategy"]],
  terc:[["boudoir","A first-time boudoir client who is interested but nervous"],["show","A venue owner considering hosting a burlesque night"]]
};
let scenario="ad";
function blueInstructions(){
  let ctx="";
  if(blueCtx.person){ const p=S.people.find(x=>x.id===blueCtx.person); if(p) ctx+=`\nPerson Dusty is working with: ${p.name}, ${p.role||""} at ${p.org||"unknown org"} (${BRANDS[p.brand].name}, stage: ${stageName(p.stage)}). What they care about: ${p.cares||"not noted"}. Notes: ${(p.notes||"").slice(0,1200)}`; }
  if(blueCtx.lesson){ const l=LESSONS.find(x=>x.id===blueCtx.lesson); ctx+=`\nDusty is working on the lesson "${l.title}" (${l.source}). His drill answer: ${S.drills[l.id]||"none yet"}. In role-play, give him chances to use this skill, and when he asks for FEEDBACK, judge him mainly on this skill.`; }
  if(blueCtx.script) ctx+=`\nThe script he wants to rehearse: ${blueCtx.script}`;
  if(blueCtx.prep) ctx+=`\nHis call prep: ${JSON.stringify(blueCtx.prep)}`;
  if(blueCtx.debrief) ctx+=`\nHis call debrief: ${JSON.stringify(blueCtx.debrief)}`;
  const bm=blueMemory();
  if(bm && blueMode!=="roleplay") ctx+=`\nBackground from Blue Bonnet's own memory of Dusty. Use it only where it changes your answer. Never recite it, and never bring up personal or sensitive items unless he does:\n- ${bm.facts.join("\n- ")}${bm.threads.length?"\nOpen threads: "+bm.threads.join("; "):""}`;
  const common=`You are Blue Bonnet, a business mentor inside Dusty's app "Clienting". Dusty runs ADV Media (live event and broadcast production in DFW, works with school districts, venues, and companies), Valencia Brown (consulting and brand strategy, advisory only, no production), and Terciopelo Media (boudoir and burlesque, kept separate and discreet). He has about 20 years in live events and wants to get better at finding clients and building lasting relationships.
Ground your coaching in these frameworks and name them when you use them: the Trust Equation from The Trusted Advisor (credibility, reliability, intimacy over self-orientation); Sandler (up-front contract, pain, budget, decision, post-sell); SPIN Selling (situation, problem, implication, need-payoff questions); Chris Voss (mirroring, labeling, calibrated what/how questions, aiming for "that's right").
Rules: Write in plain, short sentences. Never use em dashes or en dashes; use commas, periods, or colons. No hype or marketing language. No guilt words like overdue or behind. Keep replies short: usually under 150 words. Do not invent facts about specific organizations, laws, prices, or procurement rules. If something depends on a specific district's or company's policy, say he should check it, and say how. Hard boundary, never weakened: you never give a directive verdict about his personal relationships or mental health, and you never diagnose. Say plainly when something is general sales practice versus specific to his situation. Help him reach his own conclusions: ask what he thinks before giving your view on judgment calls, but give direct, specific feedback on technique when asked.`;
  if(blueMode==="roleplay"){
    const sc=(Object.values(SCENARIOS).flat().find(s=>s[0]===scenario)||SCENARIOS.adv[0])[1];
    return common+`\nMODE: Role-play. Play this prospect realistically: ${sc}. Stay in character. Be a real person: busy, a little guarded, with a real problem and a real budget limit you only reveal if he earns it with good questions and listening. Reply in 1 to 4 sentences as the prospect. If Dusty writes "FEEDBACK", step out of character and coach him: what worked, what to try, and one rewritten line, citing the framework.`+ctx;
  }
  return common+`\nMODE: Mentor. Talk through his situation, prep, or debrief with him. End most replies with one question that moves him forward.`+ctx;
}
function vBlue(m){
  const scen=Object.entries(SCENARIOS).filter(([k])=>brandOK(k)).flatMap(([k,a])=>a.map(s=>({k,id:s[0],t:s[1]})));
  if(!scen.find(s=>s.id===scenario) && scen.length) scenario=scen[0].id;
  const ctxBits=[]; if(blueCtx.person){const p=S.people.find(x=>x.id===blueCtx.person); if(p) ctxBits.push(p.name);} if(blueCtx.lesson) ctxBits.push("lesson: "+LESSONS.find(x=>x.id===blueCtx.lesson).title); if(blueCtx.script) ctxBits.push("your script"); if(blueCtx.prep) ctxBits.push("call prep"); if(blueCtx.debrief) ctxBits.push("debrief");
  m.innerHTML=`<h1>Blue Bonnet</h1><p class="page-sub">Your mentor for client work. Talk something through, or have her play a client.</p><div class="card">
    <div class="row"><span class="bb">${icon("blue",20)} Blue Bonnet</span><span class="spacer"></span>
    <div class="seg">${[["mentor","Mentor me"],["roleplay","Role-play a client"]].map(([k,v])=>`<button data-bm="${k}" class="${blueMode===k?"on":""}">${v}</button>`).join("")}</div></div>
    ${blueMode==="roleplay"?`<label>Who Blue plays</label><select id="scSel">${scen.map(s=>`<option value="${s.id}" ${s.id===scenario?"selected":""}>${BRANDS[s.k].name}: ${esc(s.t)}</option>`).join("")}</select>
      <p class="muted small" style="margin:6px 0 0">Open the conversation like it's real. Type <b>FEEDBACK</b> anytime to get coached.</p>`:
      `<p class="muted small" style="margin:8px 0 0">Bring a real situation: a client gone quiet, a pricing talk, a bid you're unsure about, a call you want to rehearse.</p>`}
    ${ctxBits.length?`<div class="row small" style="margin-top:8px"><span class="muted">Blue can see:</span>${ctxBits.map(b=>`<span class="pill">${esc(b)}</span>`).join("")}<button class="btn ghost mini" id="clrCtx">Clear</button></div>`:""}
  </div>
  <div class="card"><div class="chat" id="chat">${blueMsgs.length?blueMsgs.map(x=>`<div class="msg ${x.role==="user"?"me":"blue"}"><span class="who">${x.role==="user"?"You":(blueMode==="roleplay"?"Prospect (Blue)":"Blue Bonnet")}</span>${esc(x.content)}</div>`).join(""):`<div class="empty">${blueMode==="roleplay"?"Say hello the way you would on a real call.":"What are you working on?"}</div>`}</div>
    <textarea id="bIn" placeholder="${blueMode==="roleplay"?"Hi, this is Dusty with ADV Media…":"Type here"}" style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="bSend">Send</button>${blueMode==="roleplay"?`<button class="btn" id="bFb">Get feedback</button>`:""}<button class="btn ghost" id="bNew">Start over</button><span class="muted small" id="bStat"></span></div>
  </div>`;
  m.querySelectorAll("[data-bm]").forEach(b=>b.onclick=()=>{ if(blueMode!==b.dataset.bm){blueMode=b.dataset.bm; blueMsgs=[];} render();});
  const sc=$("#scSel"); if(sc) sc.onchange=e=>{scenario=e.target.value; blueMsgs=[]; render();};
  const cc=$("#clrCtx"); if(cc) cc.onclick=()=>{blueCtx={}; render();};
  $("#bNew").onclick=()=>{blueMsgs=[]; render();};
  $("#bSend").onclick=()=>sendBlue($("#bIn").value);
  const fb=$("#bFb"); if(fb) fb.onclick=()=>sendBlue("FEEDBACK");
  $("#bIn").onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) sendBlue($("#bIn").value); };
  const ch=$("#chat"); ch.scrollTop=ch.scrollHeight;
  if(!sampleFn && !kitReady()) $("#bStat").textContent="Connecting to Blue…";
}

  try{ if(window.claude&&window.claude.use){ sampleFn=await window.claude.use("sample"); } }catch(e){}

/* Real Blue Bonnet: when hosted on dustin12342986-hue.github.io next to blue-bonnet-kit.js,
   Blue runs through the same kit, Cloudflare worker and gateway fallback as the other apps. */
const BB_PROXY_URL="https://blue-bonnet-app-proxy.dustin12342986.workers.dev";
const BB_GATEWAY_KEY="e368f85d1ce08cb81e252c1f9e31294b7d8dc88cf295be38";
/* Shared memory: Clienting reads Blue Bonnet's memory (same github.io origin) but never writes to it.
   Mentor conversations are left in a handoff key; the beta files them with its own recordEpisode(). */
const BB_MEM_KEYS=["bluebonnet-memory-beta","bluebonnet-memory-v1"];
const BB_HANDOFF_KEY="bluebonnet-handoff-clienting";
function blueMemory(){
  if(S.settings.shareBlueMem===false) return null;
  for(const k of BB_MEM_KEYS){
    try{
      const raw=localStorage.getItem(k); if(!raw) continue;
      const m=JSON.parse(raw); const now=Date.now();
      const amp=f=>{const hl=21*(1+Math.log2(Math.max(1,f.hits||1))); const d=Math.max(0,(now-(f.lastHeard||now))/86400000); return Math.max(0,Math.min(1,(f.amplitude!=null?f.amplitude:1)*Math.pow(0.5,d/hl)));};
      const facts=(m.facts||[]).filter(f=>f&&typeof f==="object"&&f.text).map(f=>({t:f.text,a:amp(f)})).filter(x=>x.a>=0.22).sort((a,b)=>b.a-a.a).slice(0,14).map(x=>x.t);
      const threads=(m.openThreads||[]).slice(-5).map(t=>t.text).filter(Boolean);
      if(facts.length||threads.length) return {key:k,facts,threads};
    }catch(e){}
  }
  return null;
}
function handOff(turns){
  if(S.settings.shareBlueMem===false) return;
  try{
    const list=JSON.parse(localStorage.getItem(BB_HANDOFF_KEY)||"[]");
    list.push({id:"c"+Date.now()+Math.random().toString(36).slice(2,6),at:Date.now(),source:"clienting",turns});
    while(JSON.stringify(list).length>200000) list.shift();
    localStorage.setItem(BB_HANDOFF_KEY,JSON.stringify(list));
  }catch(e){}
}
function kitReady(){ return typeof BBKit!=="undefined" && !!BBKit && typeof BBKit.ask==="function"; }
if(kitReady()){ try{ BBKit.configure({anthropicProxyUrl:BB_PROXY_URL, gatewayKey:BB_GATEWAY_KEY, app:"clienting"}); }catch(e){} }
async function sendBlueKit(text){
  blueMsgs.push({role:"user",content:text}); blueBusy=true; render(); $("#bStat").textContent="Blue is thinking…";
  const full=blueInstructions(); const cut=full.indexOf("\nMODE:");
  const system=[{type:"text",text:full.slice(0,cut),cache_control:{type:"ephemeral"}},{type:"text",text:full.slice(cut)}];
  const messages=blueMsgs.map(x=>({role:x.role,content:x.content}));
  try{
    const r=await BBKit.ask({system,messages,maxTokens:700,session:"clienting",onStatus:t=>{const el=$("#bStat"); if(el) el.textContent=t;}});
    blueMsgs.push({role:"assistant",content:r.text||""}); blueBusy=false; render();
    if(blueMode==="mentor" && r.text) handOff([{role:"user",text:"[Clienting, business mentoring] "+text},{role:"assistant",text:r.text}]);
    if(r.usedBackup) $("#bStat").textContent="Answered by the backup brain";
  }catch(e){
    blueMsgs.pop(); blueBusy=false; render();
    let msg="Blue couldn't answer. "; try{ msg+=BBKit.explainError?BBKit.explainError(e).message:String(e.message||e); }catch(_){ msg+=String(e.message||e); }
    $("#bStat").textContent=msg;
  }
}
async function sendBlue(text){
  text=(text||"").trim(); if(!text||blueBusy) return;
  if(kitReady()) return sendBlueKit(text);
  const s=await getSample();
  if(!s){ $("#bStat").textContent="Blue isn't available here. Open Clienting from GitHub Pages or its claude.ai link."; return; }
  blueMsgs.push({role:"user",content:text}); blueBusy=true; render(); $("#bStat").textContent="Blue is thinking…";
  const reply={role:"assistant",content:""}; blueMsgs.push(reply);
  const who=blueMode==="roleplay"?"Prospect":"Blue";
  const transcript=blueMsgs.slice(0,-1).map(x=>(x.role==="user"?"Dusty: ":who+": ")+x.content).join("\n\n");
  const prompt=blueInstructions()+"\n\nConversation so far:\n"+transcript+"\n\nWrite only the next reply from "+(text==="FEEDBACK"?"Blue Bonnet as coach":who)+". No name prefix.";
  try{
    const label=blueMode==="roleplay"&&text!=="FEEDBACK"?"Prospect (Blue)":"Blue Bonnet";
    const r=await s(prompt,{cache:false,modelTier:"default",onText:(ev)=>{reply.content=ev.text; const ch=$("#chat"); if(ch&&ch.lastElementChild) {ch.lastElementChild.innerHTML=`<span class="who">${label}</span>`+esc(ev.text); ch.scrollTop=ch.scrollHeight;}}});
    reply.content=r.text;
  }catch(e){
    blueMsgs.pop();
    const msg=e&&e.code==="rate_limited"?"Blue needs a minute. Try again shortly.":e&&e.code==="not_granted"?"Blue needs permission to run. Try again and allow it.":"Blue couldn't answer that one. Try again.";
    blueBusy=false; render(); $("#bStat").textContent=msg; return;
  }
  blueBusy=false; render();
}
